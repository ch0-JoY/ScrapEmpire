<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scrap Empire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
<header>
<div>
<h1>SCRAP EMPIRE</h1>
<p>Junkyard Tycoon</p>
</div>
<div class="stats">
<div class="money">💵 <span id="money">0</span></div>
<div class="lvl">LVL <span id="level">1</span></div>
</div>
</header>

<section class="garage">
<h2>Garage</h2>
<div class="xp"><div id="xpBar"></div></div>

<div id="gameArea">
<div id="crate" class="crate">📦</div>
<p id="hint">Tap container</p>
</div>

<div class="carCard">
<h3 id="carName">No car</h3>
<p id="rarity">-</p>
</div>
</section>

<nav>
<button>🏭</button>
<button>🛒</button>
<button>🎒</button>
<button>👤</button>
</nav>
</div>
<script src="script.js"></script>
</body>
</html>
