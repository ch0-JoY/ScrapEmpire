<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Salvage Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0f0f15; color: #fff; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; max-width: 500px; margin: 0 auto; }
        
        /* HEADER */
        header { background: #1a1a24; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d2d3f; }
        .stats { display: flex; gap: 15px; font-weight: 800; font-size: 1.1rem; }
        .money { color: #4caf50; }
        .gems { color: #00bcd4; }

        /* GARAGE AREA */
        .garage-card { background: #161620; border-radius: 12px; padding: 10px; border: 1px solid #2d2d3f; text-align: center; position: relative; }
        .status-badge { background: #252535; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 8px; color: #aaa; border: 1px solid #3d3d52; }
        canvas { width: 100%; height: 200px; background: #0b0b10; border-radius: 8px; display: block; touch-action: none; }

        /* SECTIONS */
        .section-title { font-size: 0.8rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; font-weight: bold; }
        
        /* GRID & BUTTONS */
        .parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .part-card { background: #1c1c28; border: 1px solid #2d2d3f; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .part-card.removed { opacity: 0.25; filter: grayscale(1); }
        .part-info { font-size: 0.8rem; }
        .part-price { color: #4caf50; font-size: 0.75rem; font-weight: bold; }
        .btn-remove { background: #e53935; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .btn-remove:active { transform: scale(0.95); }

        /* SHOP */
        .shop-list { display: flex; flex-direction: column; gap: 8px; }
        .btn-buy { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; width: 100%; display: flex; justify-content: space-between; align-items: center; border: 1px solid #4caf50; }
        .btn-buy:disabled { background: #222; border-color: #333; color: #555; }
        .btn-upgrade { background: #252538; color: white; border: 1px solid #3d3d52; padding: 10px 12px; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .btn-upgrade:disabled { opacity: 0.5; }
        
        /* FLOATING TEXT ANIMATION */
        .floating-text { position: absolute; color: #4caf50; font-weight: bold; font-size: 1.2rem; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 0.9rem;">🛠 Auto Salvage</div>
        <div class="stats">
            <span class="money">💵 $<span id="money">1000</span></span>
            <span class="gems">💎 <span id="gems">10</span></span>
        </div>
    </header>

    <!-- ГАРАЖ С МАКЕТОМ МАШИНЫ -->
    <div class="garage-card" id="garage-box">
        <div class="status-badge" id="status-text">Закажите авто на рынке</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- ДЕТАЛИ -->
    <div class="section-title">⚙️ Список деталей</div>
    <div class="parts-grid" id="parts-container">
        <div style="grid-column: span 2; text-align: center; color: #555; padding: 15px; background: #161620; border-radius: 8px;">
            Гараж пуст
        </div>
    </div>

    <!-- АВТОРЫНОК -->
    <div class="section-title">🚗 Эвакуатор и Заказ</div>
    <div class="shop-list">
        <button class="btn-buy" id="buy-btn" onclick="buyCar()">
            <span>Купить авто</span>
            <span id="car-cost">$300</span>
        </button>
    </div>

    <!-- УЛУЧШЕНИЯ И ПЕРСОНАЛ -->
    <div class="section-title">🛠 Улучшения и Рабочие</div>
    <div class="shop-list">
        <button class="btn-upgrade" id="btn-pneumo" onclick="buyUpgrade('pneumo')">
            <span>⚡ Пневмоинструмент (+20% стоимости)</span>
            <span id="cost-pneumo">$500</span>
        </button>
        <button class="btn-upgrade" id="btn-mechanic" onclick="hireWorker('mechanic')">
            <span>👷 Механик (авто-разбор)</span>
            <span id="cost-mechanic">$1000</span>
        </button>
    </div>

    <script>
        // --- СОСТОЯНИЕ И СОХРАНЕНИЕ ---
        let state = {
            money: 1000,
            gems: 10,
            currentCar: null,
            gameState: 'IDLE', // IDLE, DELIVERING, GARAGE
            towProgress: 0,
            pneumoLevel: 1,
            workers: { mechanic: false }
        };

        function saveGame() {
            localStorage.setItem('salvage_game_save', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('salvage_game_save');
            if (saved) {
                try {
                    const loaded = JSON.parse(saved);
                    state = { ...state, ...loaded };
                } catch(e) {}
            }
        }
        loadGame();

        // --- БАЗА ДАННЫХ ---
        const CAR_MODELS = [
            { name: "Старый Хэтчбек", rarity: "🟢 Обычный", color: "#66bb6a", basePrice: 300, mult: 1 },
            { name: "Ржавый Седан", rarity: "🟢 Обычный", color: "#8d6e63", basePrice: 500, mult: 1.3 },
            { name: "Турбо Купе", rarity: "🔵 Редкий", color: "#29b6f6", basePrice: 1200, mult: 2.5 },
            { name: "GT-RX", rarity: "🟣 Эпик", color: "#ab47bc", basePrice: 4000, mult: 5.5 },
            { name: "Phantom X", rarity: "🟠 Легенда", color: "#ffa726", basePrice: 12000, mult: 14 }
        ];

        const BASE_PARTS = [
            { id: 'door', name: '🚪 Дверь', ratio: 0.15 },
            { id: 'wheel', name: '🛞 Колесо', ratio: 0.12 },
            { id: 'battery', name: '🔋 Аккум', ratio: 0.13 },
            { id: 'generator', name: '🪫 Генератор', ratio: 0.18 },
            { id: 'engine', name: '🛠 Двигатель', ratio: 0.34 },
            { id: 'body', name: '🚘 Кузов', ratio: 0.28 }
        ];

        // --- CANVAS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth - 20;
            canvas.height = 200;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ЛОГИКА ---
        function updateUI() {
            document.getElementById('money').innerText = Math.floor(state.money);
            document.getElementById('gems').innerText = state.gems;
            document.getElementById('buy-btn').disabled = state.gameState !== 'IDLE';

            if (state.workers.mechanic) {
                document.getElementById('cost-mechanic').innerText = "Нанят";
                document.getElementById('btn-mechanic').disabled = true;
            }

            renderParts();
            saveGame();
        }

        function buyCar() {
            if (state.gameState !== 'IDLE') return;

            const rand = Math.random();
            let model = CAR_MODELS[0];
            if (rand > 0.4) model = CAR_MODELS[1];
            if (rand > 0.7) model = CAR_MODELS[2];
            if (rand > 0.9) model = CAR_MODELS[3];
            if (rand > 0.98) model = CAR_MODELS[4];

            if (state.money < model.basePrice) {
                alert("Не хватает денег!");
                return;
            }

            state.money -= model.basePrice;
            state.currentCar = {
                ...model,
                parts: BASE_PARTS.map(p => ({
                    ...p,
                    price: Math.floor(model.basePrice * p.ratio * model.mult * state.pneumoLevel),
                    removed: false
                }))
            };

            state.gameState = 'DELIVERING';
            state.towProgress = 0;
            document.getElementById('status-text').innerText = "Эвакуатор везёт авто...";
            updateUI();
        }

        function removePart(id, event) {
            if (state.gameState !== 'GARAGE' || !state.currentCar) return;

            const part = state.currentCar.parts.find(p => p.id === id);
            if (part && !part.removed) {
                part.removed = true;
                state.money += part.price;

                // Всплывающий текст с деньгами
                showMoneyAnim(`+$${part.price}`, event);

                if (state.currentCar.parts.every(p => p.removed)) {
                    state.gameState = 'IDLE';
                    state.currentCar = null;
                    document.getElementById('status-text').innerText = "Машина разобрана! Купите новую.";
                }
                updateUI();
            }
        }

        function showMoneyAnim(text, e) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            
            const box = document.getElementById('garage-box').getBoundingClientRect();
            el.style.left = (box.width / 2) + 'px';
            el.style.top = (box.height / 2) + 'px';

            document.getElementById('garage-box').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function renderParts() {
            const container = document.getElementById('parts-container');
            container.innerHTML = '';

            if (!state.currentCar || state.gameState !== 'GARAGE') {
                container.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #555; padding: 15px; background: #161620; border-radius: 8px;">Гараж пуст</div>';
                return;
            }

            state.currentCar.parts.forEach(p => {
                const card = document.createElement('div');
                card.className = `part-card ${p.removed ? 'removed' : ''}`;
                card.innerHTML = `
                    <div class="part-info">
                        <div>${p.name}</div>
                        <div class="part-price">+$${p.price}</div>
                    </div>
                    ${!p.removed ? `<button class="btn-remove" onclick="removePart('${p.id}', event)">Снять</button>` : '<span>✓</span>'}
                `;
                container.appendChild(card);
            });
        }

        function buyUpgrade(type) {
            if (type === 'pneumo' && state.money >= 500) {
                state.money -= 500;
                state.pneumoLevel += 0.2;
                document.getElementById('cost-pneumo').innerText = `Ур. ${Math.round(state.pneumoLevel * 10) / 10}`;
                updateUI();
            }
        }

        function hireWorker(type) {
            if (type === 'mechanic' && !state.workers.mechanic && state.money >= 1000) {
                state.money -= 1000;
                state.workers.mechanic = true;
                updateUI();
            }
        }

        // МЕХАНИК (Авто-разборка раз в 2.5 сек)
        setInterval(() => {
            if (state.gameState === 'GARAGE' && state.currentCar && state.workers.mechanic) {
                const nextPart = state.currentCar.parts.find(p => !p.removed);
                if (nextPart) removePart(nextPart.id);
            }
        }, 2500);

        // --- РИСОВАНИЕ ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Гаражная база
            ctx.fillStyle = "#161620";
            ctx.fillRect(cx - 110, cy - 65, 220, 130);
            ctx.strokeStyle = "#2d2d3f";
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - 110, cy - 65, 220, 130);

            // Эвакуатор
            if (state.gameState === 'DELIVERING') {
                state.towProgress += 0.025;
                const x = -80 + (cx + 80) * state.towProgress;

                ctx.fillStyle = "#ffb300";
                ctx.fillRect(x - 40, cy - 15, 80, 30);
                ctx.fillStyle = "#222";
                ctx.fillRect(x + 10, cy - 25, 25, 20);

                if (state.towProgress >= 1) {
                    state.gameState = 'GARAGE';
                    document.getElementById('status-text').innerText = `${state.currentCar.rarity} ${state.currentCar.name}`;
                    updateUI();
                }
            }

            // Автомобиль в гараже
            if (state.gameState === 'GARAGE' && state.currentCar) {
                const bodyPart = state.currentCar.parts.find(p => p.id === 'body');
                
                // Модель машины (если кузов не снят)
                if (!bodyPart.removed) {
                    ctx.fillStyle = state.currentCar.color;
                    ctx.beginPath();
                    ctx.roundRect(cx - 65, cy - 25, 130, 50, 10);
                    ctx.fill();

                    // Стекла
                    ctx.fillStyle = "#111";
                    ctx.fillRect(cx - 20, cy - 20, 50, 40);
                }

                // Колеса (если не сняты)
                const wheelPart = state.currentCar.parts.find(p => p.id === 'wheel');
                if (!wheelPart.removed) {
                    ctx.fillStyle = "#333";
                    ctx.fillRect(cx - 50, cy - 32, 20, 10);
                    ctx.fillRect(cx + 30, cy - 32, 20, 10);
                    ctx.fillRect(cx - 50, cy + 22, 20, 10);
                    ctx.fillRect(cx + 30, cy + 22, 20, 10);
                }

                // Название
                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(state.currentCar.name, cx, cy + 50);
            }

            requestAnimationFrame(draw);
        }

        updateUI();
        draw();
    </script>
</body>
</html>
