<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторазборка: Империя</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>

<div id="loadingScreen">
  <div class="logo">
    <h1>🚗 АВТОРАЗБОРКА</h1>
    <h2>ИМПЕРИЯ</h2>
  </div>

  <div class="loadingBar">
    <div id="loadingProgress"></div>
  </div>

  <p>Загрузка...</p>
</div>

<div id="menu" class="hidden">

<header>
  <div class="player">
    <div class="money">💵 <span id="money">500</span> ₽</div>
    <div class="level">⭐ Уровень <span id="level">1</span></div>
  </div>
</header>

<main>

<section class="garage">
<h2>🏭 Гараж</h2>

<div class="garageImage">🚚</div>

<p>Ваш гараж готов к работе</p>

<button id="playButton">НАЧАТЬ РАБОТУ</button>

</section>

<section class="garageInfo">

<div class="card">
<h3>Доход</h3>
<p>0 ₽/мин</p>
</div>

<div class="card">
<h3>Разобрано машин</h3>
<p id="carsCount">0</p>
</div>

</section>

</main>

<nav>
<button id="garageBtn">🏭 Гараж</button>
<button id="auctionBtn">🚗 Аукцион</button>
<button id="shopBtn">🛒 Магазин</button>
<button id="inventoryBtn">📦 Склад</button>
<button id="profileBtn">👤 Профиль</button>
</nav>

</div>

<div id="gameScreen" class="hidden">

<header>
<div class="money">💵 <span id="gameMoney">500</span> ₽</div>
</header>

<div class="workspace">

<div id="carPlace">🚗</div>

<div class="controls">
<button id="buyCar">КУПИТЬ МАШИНУ</button>
<button id="disassemble" disabled>РАЗОБРАТЬ</button>
</div>

</div>

</div>

<script src="js/main.js"></script>

</body>
</html>
