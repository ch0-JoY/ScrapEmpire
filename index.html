<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Auto Salvage Tycoon</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Arial Black', -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2b1f3d;
            color: #fff;
        }

        body { 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            max-width: 480px; 
            margin: 0 auto; 
        }

        /* TOP RESOURCE BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            height: 45px;
            flex-shrink: 0;
        }

        .resource-pill {
            background: #181124;
            border: 3px solid #3d2c58;
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4);
            flex: 1;
            justify-content: center;
            height: 100%;
        }
        .res-money { color: #ffca28; }
        .res-gems { color: #00e5ff; }

        .btn-settings {
            background: #fff;
            border: 3px solid #ccc;
            border-radius: 12px;
            width: 42px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #999;
            cursor: pointer;
        }

        /* GARAGE AREA */
        .garage-area {
            background: #3e2e56;
            border: 4px solid #5a437c;
            border-radius: 16px;
            padding: 8px;
            text-align: center;
            box-shadow: 0 6px 0 #1c1429;
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-height: 40vh;
            margin: 8px 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            max-height: 180px;
            background: #1a1325;
            border-radius: 10px;
            border: 2px solid #2b1e3f;
            display: block;
        }

        .status-badge {
            background: #ff9800;
            color: #fff;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 6px;
            border: 2px solid #fff;
            box-shadow: 0 2px 0 #b26a00;
        }

        /* PARTS CONTAINER */
        .parts-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
            min-height: 90px;
            flex-shrink: 0;
        }

        .part-btn {
            background: linear-gradient(180deg, #ff5722 0%, #d84315 100%);
            border: 2px solid #ffab91;
            border-radius: 12px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #8d2600;
            cursor: pointer;
            color: white;
            text-shadow: 0 1px 2px #000;
            touch-action: manipulation;
        }

        .part-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #8d2600;
        }

        .part-btn.disabled {
            background: #423752;
            border-color: #5c4e70;
            box-shadow: 0 3px 0 #231c2e;
            opacity: 0.5;
            pointer-events: none;
        }

        /* BOTTOM CASUAL BUTTONS GRID */
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            height: 80px;
            flex-shrink: 0;
        }

        .c-btn {
            background: linear-gradient(180deg, #29b6f6 0%, #0288d1 100%);
            border: 2px solid #b3e5fc;
            border-radius: 14px;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            box-shadow: 0 4px 0 #01579b;
            color: white;
            text-shadow: 0 1px 2px #000;
            cursor: pointer;
            touch-action: manipulation;
        }

        .c-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #01579b;
        }

        .c-btn-shop { background: linear-gradient(180deg, #ab47bc 0%, #7b1fa2 100%); border-color: #e1bee7; box-shadow: 0 4px 0 #4a148c; }
        .c-btn-add { background: linear-gradient(180deg, #66bb6a 0%, #388e3c 100%); border-color: #c8e6c9; box-shadow: 0 4px 0 #1b5e20; }
        .c-btn-achieve { background: linear-gradient(180deg, #ffa726 0%, #f57c00 100%); border-color: #ffe0b2; box-shadow: 0 4px 0 #e65100; }

        .c-btn .icon { font-size: 1.2rem; }
        .c-btn .title { font-size: 0.6rem; text-transform: uppercase; }
        .c-btn .price-tag {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 1px 4px;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* POPUP MODAL */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-body {
            background: #3e2e56;
            border: 3px solid #5a437c;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 0 #1c1429;
        }

        .modal-title {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #ffca28;
        }

        .achieve-item {
            background: #251b35;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3d2c58;
        }

        .btn-close {
            background: #e53935;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 10px;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
            box-shadow: 0 3px 0 #b71c1c;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ С РЕСУРСАМИ -->
    <div class="top-bar">
        <div class="btn-settings">⚙️</div>
        <div class="resource-pill res-money">
            <span>🪙</span>
            <span id="money">1,000</span>
        </div>
        <div class="resource-pill res-gems">
            <span>💎</span>
            <span id="gems">10</span>
        </div>
    </div>

    <!-- ИГРОВАЯ ЗОНА С ГАРАЖОМ -->
    <div class="garage-area">
        <div class="status-badge" id="status-text">Закажите авто</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- КНОПКИ ДЕТАЛЕЙ ДЛЯ РАЗБОРКИ -->
    <div class="parts-container" id="parts-grid">
        <!-- Генерируются динамически -->
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="bottom-grid">
        <div class="c-btn c-btn-shop" id="btn-shop">
            <span class="icon">🛒</span>
            <span class="title">Магазин</span>
            <span class="price-tag">VIP</span>
        </div>
        <div class="c-btn c-btn-add" id="btn-add-car">
            <span class="icon">🚗</span>
            <span class="title">Заказ</span>
            <span class="price-tag">🪙 <span id="car-cost">300</span></span>
        </div>
        <div class="c-btn" id="btn-upgrade">
            <span class="icon">⚡</span>
            <span class="title">Пневмо</span>
            <span class="price-tag">🪙 500</span>
        </div>
        <div class="c-btn c-btn-achieve" id="btn-achieve">
            <span class="icon">🏆</span>
            <span class="title">Ачивки</span>
            <span class="price-tag">REWARD</span>
        </div>
    </div>

    <!-- ПОП-АП ДОСТИЖЕНИЙ -->
    <div class="modal" id="achieve-modal">
        <div class="modal-body">
            <div class="modal-title">🏆 ДОСТИЖЕНИЯ</div>
            <div id="achieve-list"></div>
            <button class="btn-close" id="btn-close-achieve">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        let state = {
            money: 1000,
            gems: 10,
            currentCar: null,
            gameState: 'IDLE',
            towProgress: 0,
            pneumoMult: 1,
            stats: { dismantled: 0, parts: 0 },
            claimedAch: []
        };

        const CAR_MODELS = [
            { name: "Ржавый Жук", color: "#e57373", basePrice: 300, mult: 1 },
            { name: "Стрит Райдер", color: "#64b5f6", basePrice: 600, mult: 1.5 },
            { name: "Кибер Грузовик", color: "#81c784", basePrice: 1200, mult: 2.5 },
            { name: "Гоночный Болид", color: "#ba68c8", basePrice: 3000, mult: 4.5 },
            { name: "Неоновый Фантом", color: "#ffd54f", basePrice: 8000, mult: 9.0 }
        ];

        const BASE_PARTS = [
            { id: 'wheel', name: '🛞 Колесо', bolts: 4, ratio: 0.12 },
            { id: 'door', name: '🚪 Дверь', bolts: 2, ratio: 0.18 },
            { id: 'engine', name: '🛠 Мотор', bolts: 5, ratio: 0.40 },
            { id: 'hood', name: '🚘 Капот', bolts: 2, ratio: 0.15 },
            { id: 'battery', name: '🔋 Аккум', bolts: 1, ratio: 0.15 }
        ];

        const ACHIEVEMENTS = [
            { id: 'car1', title: 'Первая разборка', desc: 'Разобрать 1 авто', reward: 5, check: s => s.stats.dismantled >= 1 },
            { id: 'parts10', title: 'Опытный механик', desc: 'Снять 10 деталей', reward: 10, check: s => s.stats.parts >= 10 }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function updateUI() {
            document.getElementById('money').innerText = state.money.toLocaleString();
            document.getElementById('gems').innerText = state.gems;
            renderParts();
        }

        function buyCar() {
            if (state.gameState !== 'IDLE') return;
            if (state.money < 300) { alert("Не хватает денег!"); return; }

            state.money -= 300;
            const model = CAR_MODELS[Math.floor(Math.random() * CAR_MODELS.length)];

            state.currentCar = {
                ...model,
                parts: BASE_PARTS.map(p => ({
                    ...p,
                    boltsLeft: p.bolts,
                    price: Math.floor(model.basePrice * p.ratio * model.mult * state.pneumoMult),
                    removed: false
                }))
            };

            state.gameState = 'DELIVERING';
            state.towProgress = 0;
            document.getElementById('status-text').innerText = "Доставка авто...";
            updateUI();
        }

        function tapPart(id) {
            if (!state.currentCar || state.gameState !== 'GARAGE') return;
            const part = state.currentCar.parts.find(p => p.id === id);

            if (part && !part.removed) {
                part.boltsLeft--;
                if (part.boltsLeft <= 0) {
                    part.removed = true;
                    state.money += part.price;
                    state.stats.parts++;

                    if (state.currentCar.parts.every(p => p.removed)) {
                        state.gameState = 'IDLE';
                        state.stats.dismantled++;
                        state.currentCar = null;
                        document.getElementById('status-text').innerText = "Готово! Закажите еще";
                    }
                }
                updateUI();
            }
        }

        function renderParts() {
            const grid = document.getElementById('parts-grid');
            grid.innerHTML = '';

            if (!state.currentCar || state.gameState !== 'GARAGE') {
                grid.innerHTML = '<div style="grid-column: span 3; text-align:center; opacity:0.5; font-size:0.75rem; align-self:center;">Гараж пуст</div>';
                return;
            }

            state.currentCar.parts.forEach(p => {
                const btn = document.createElement('div');
                btn.className = `part-btn ${p.removed ? 'disabled' : ''}`;
                btn.addEventListener('click', () => tapPart(p.id));
                btn.innerHTML = `
                    <div style="font-size:1rem">${p.name.split(' ')[0]}</div>
                    <div style="font-size:0.6rem">${p.name.split(' ')[1]}</div>
                    ${!p.removed ? `<div style="font-size:0.65rem; color:#ffeb3b">🔩 x${p.boltsLeft}</div>` : '✓'}
                `;
                grid.appendChild(btn);
            });
        }

        function openAchievements() {
            const list = document.getElementById('achieve-list');
            list.innerHTML = '';
            ACHIEVEMENTS.forEach(a => {
                const isDone = state.claimedAch.includes(a.id);
                const canGet = a.check(state) && !isDone;
                
                const item = document.createElement('div');
                item.className = 'achieve-item';
                item.innerHTML = `
                    <div>
                        <div style="font-size:0.8rem">${a.title}</div>
                        <div style="font-size:0.65rem; color:#aaa">${a.desc}</div>
                    </div>
                `;
                if(canGet) {
                    const btn = document.createElement('button');
                    btn.style.cssText = 'background:#4caf50; border:none; color:#fff; padding:4px 8px; border-radius:6px; font-size:0.7rem; font-weight:bold;';
                    btn.innerText = `+💎${a.reward}`;
                    btn.onclick = () => claimAch(a.id, a.reward);
                    item.appendChild(btn);
                } else if(isDone) {
                    item.innerHTML += '<span>✅</span>';
                }
                list.appendChild(item);
            });
            document.getElementById('achieve-modal').style.display = 'flex';
        }

        function claimAch(id, reward) {
            state.claimedAch.push(id);
            state.gems += reward;
            openAchievements();
            updateUI();
        }

        // НАЗНАЧЕНИЕ СОБЫТИЙ ДЛЯ КНОПОК
        document.getElementById('btn-add-car').addEventListener('click', buyCar);
        document.getElementById('btn-shop').addEventListener('click', () => alert("Магазин скоро откроется!"));
        document.getElementById('btn-upgrade').addEventListener('click', () => {
            if(state.money >= 500) { state.money -= 500; state.pneumoMult += 0.3; updateUI(); }
            else { alert("Не хватает денег!"); }
        });
        document.getElementById('btn-achieve').addEventListener('click', openAchievements);
        document.getElementById('btn-close-achieve').addEventListener('click', () => {
            document.getElementById('achieve-modal').style.display = 'none';
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (state.gameState === 'DELIVERING') {
                state.towProgress += 0.025;
                const x = -60 + (cx + 60) * state.towProgress;
                
                ctx.fillStyle = "#ff9800";
                ctx.fillRect(x - 30, cy - 10, 50, 20);
                if (state.towProgress >= 1) {
                    state.gameState = 'GARAGE';
                    document.getElementById('status-text').innerText = state.currentCar.name;
                    updateUI();
                }
            }

            if (state.gameState === 'GARAGE' && state.currentCar) {
                ctx.fillStyle = state.currentCar.color;
                ctx.beginPath();
                ctx.roundRect(cx - 50, cy - 20, 100, 40, 10);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#fff";
                ctx.stroke();

                ctx.fillStyle = "#263238";
                ctx.fillRect(cx - 15, cy - 15, 40, 30);

                ctx.fillStyle = "#111";
                ctx.beginPath();
                ctx.arc(cx - 30, cy + 20, 10, 0, Math.PI*2);
                ctx.arc(cx + 30, cy + 20, 10, 0, Math.PI*2);
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        resizeCanvas();
        updateUI();
        draw();
    </script>
</body>
</html>
