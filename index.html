<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Salvage Tycoon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', -apple-system, sans-serif; user-select: none; }
        
        body { 
            background: #2b1f3d; 
            color: #fff; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            min-height: 100vh; 
            max-width: 480px; 
            margin: 0 auto; 
            overflow: hidden;
        }

        /* TOP RESOURCE BAR (В стиле скрина) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .resource-pill {
            background: #181124;
            border: 3px solid #3d2c58;
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4);
            flex: 1;
            justify-content: center;
        }
        .res-money { color: #ffca28; }
        .res-gems { color: #00e5ff; }

        .btn-settings {
            background: #fff;
            border: 3px solid #ccc;
            border-radius: 12px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #999;
        }

        /* GARAGE DISPLAY */
        .garage-area {
            background: #3e2e56;
            border: 4px solid #5a437c;
            border-radius: 20px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 8px 0 #1c1429, inset 0 4px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        canvas {
            width: 100%;
            height: 180px;
            background: #1a1325;
            border-radius: 12px;
            border: 3px solid #2b1e3f;
            display: block;
        }

        .status-badge {
            background: #ff9800;
            color: #fff;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 6px;
            border: 2px solid #fff;
            box-shadow: 0 3px 0 #b26a00;
        }

        /* PARTS ACTION GRID */
        .parts-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 8px 0;
        }

        .part-btn {
            background: linear-gradient(180deg, #ff5722 0%, #d84315 100%);
            border: 3px solid #ffab91;
            border-radius: 14px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #8d2600;
            cursor: pointer;
            color: white;
            text-shadow: 0 1px 2px #000;
        }

        .part-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #8d2600;
        }

        .part-btn.disabled {
            background: #423752;
            border-color: #5c4e70;
            box-shadow: 0 4px 0 #231c2e;
            opacity: 0.6;
        }

        /* BOTTOM CASUAL BUTTONS GRID (Как на скрине) */
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: auto;
        }

        .c-btn {
            background: linear-gradient(180deg, #29b6f6 0%, #0288d1 100%);
            border: 3px solid #b3e5fc;
            border-radius: 16px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 85px;
            box-shadow: 0 6px 0 #01579b;
            color: white;
            text-shadow: 0 1px 2px #000;
            cursor: pointer;
        }

        .c-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #01579b;
        }

        .c-btn-shop { background: linear-gradient(180deg, #ab47bc 0%, #7b1fa2 100%); border-color: #e1bee7; box-shadow: 0 6px 0 #4a148c; }
        .c-btn-add { background: linear-gradient(180deg, #66bb6a 0%, #388e3c 100%); border-color: #c8e6c9; box-shadow: 0 6px 0 #1b5e20; }
        .c-btn-achieve { background: linear-gradient(180deg, #ffa726 0%, #f57c00 100%); border-color: #ffe0b2; box-shadow: 0 6px 0 #e65100; }

        .c-btn .icon { font-size: 1.5rem; }
        .c-btn .title { font-size: 0.65rem; text-transform: uppercase; }
        .c-btn .price-tag {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* POPUP MODAL (Достижения/Магазин) */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-body {
            background: #3e2e56;
            border: 4px solid #5a437c;
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 0 #1c1429;
        }

        .modal-title {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #ffca28;
            text-shadow: 0 2px 0 #000;
        }

        .achieve-item {
            background: #251b35;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #3d2c58;
        }

        .btn-close {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 0 4px 0 #b71c1c;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ С РЕСУРСАМИ -->
    <div class="top-bar">
        <div class="btn-settings">⚙️</div>
        <div class="resource-pill res-money">
            <span>🪙</span>
            <span id="money">1,000</span>
        </div>
        <div class="resource-pill res-gems">
            <span>💎</span>
            <span id="gems">10</span>
        </div>
    </div>

    <!-- ИГРОВАЯ ЗОНА С ГАРАЖОМ -->
    <div class="garage-area">
        <div class="status-badge" id="status-text">Закажите авто</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- КНОПКИ ДЕТАЛЕЙ ДЛЯ РАЗБОРКИ -->
    <div class="parts-container" id="parts-grid">
        <!-- Генерируются динамически -->
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ (CASUAL UI) -->
    <div class="bottom-grid">
        <div class="c-btn c-btn-shop" onclick="openShop()">
            <span class="icon">🛒</span>
            <span class="title">Магазин</span>
            <span class="price-tag">VIP</span>
        </div>
        <div class="c-btn c-btn-add" id="btn-add-car" onclick="buyCar()">
            <span class="icon">🚗</span>
            <span class="title">Заказ</span>
            <span class="price-tag">🪙 <span id="car-cost">300</span></span>
        </div>
        <div class="c-btn" onclick="buyUpgrade()">
            <span class="icon">⚡</span>
            <span class="title">Пневмо</span>
            <span class="price-tag">🪙 500</span>
        </div>
        <div class="c-btn c-btn-achieve" onclick="openAchievements()">
            <span class="icon">🏆</span>
            <span class="title">Ачивки</span>
            <span class="price-tag">REWARD</span>
        </div>
    </div>

    <!-- ПОП-АП ДОСТИЖЕНИЙ -->
    <div class="modal" id="achieve-modal">
        <div class="modal-body">
            <div class="modal-title">🏆 ДОСТИЖЕНИЯ</div>
            <div id="achieve-list"></div>
            <button class="btn-close" onclick="closeModal('achieve-modal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        let state = {
            money: 1000,
            gems: 10,
            currentCar: null,
            gameState: 'IDLE',
            towProgress: 0,
            pneumoMult: 1,
            stats: { dismantled: 0, parts: 0 },
            claimedAch: []
        };

        // СОЧНЫЕ МОДЕЛИ МАШИН
        const CAR_MODELS = [
            { name: "Ржавый Жук", color: "#e57373", basePrice: 300, mult: 1 },
            { name: "Стрит Райдер", color: "#64b5f6", basePrice: 600, mult: 1.5 },
            { name: "Кибер Грузовик", color: "#81c784", basePrice: 1200, mult: 2.5 },
            { name: "Гоночный Болид", color: "#ba68c8", basePrice: 3000, mult: 4.5 },
            { name: "Неоновый Фантом", color: "#ffd54f", basePrice: 8000, mult: 9.0 }
        ];

        const BASE_PARTS = [
            { id: 'wheel', name: '🛞 Колесо', bolts: 4, ratio: 0.12 },
            { id: 'door', name: '🚪 Дверь', bolts: 2, ratio: 0.18 },
            { id: 'engine', name: '🛠 Мотор', bolts: 5, ratio: 0.40 },
            { id: 'hood', name: '🚘 Капот', bolts: 2, ratio: 0.15 },
            { id: 'battery', name: '🔋 Аккум', bolts: 1, ratio: 0.15 }
        ];

        const ACHIEVEMENTS = [
            { id: 'car1', title: 'Первая разборка', desc: 'Разобрать 1 авто', reward: 5, check: s => s.stats.dismantled >= 1 },
            { id: 'parts10', title: 'Опытный механик', desc: 'Снять 10 деталей', reward: 10, check: s => s.stats.parts >= 10 }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 26;
            canvas.height = 180;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateUI() {
            document.getElementById('money').innerText = state.money.toLocaleString();
            document.getElementById('gems').innerText = state.gems;
            renderParts();
        }

        function buyCar() {
            if (state.gameState !== 'IDLE') return;
            if (state.money < 300) return;

            state.money -= 300;
            const model = CAR_MODELS[Math.floor(Math.random() * CAR_MODELS.length)];

            state.currentCar = {
                ...model,
                parts: BASE_PARTS.map(p => ({
                    ...p,
                    boltsLeft: p.bolts,
                    price: Math.floor(model.basePrice * p.ratio * model.mult * state.pneumoMult),
                    removed: false
                }))
            };

            state.gameState = 'DELIVERING';
            state.towProgress = 0;
            document.getElementById('status-text').innerText = "Доставка авто...";
            updateUI();
        }

        function tapPart(id) {
            if (!state.currentCar || state.gameState !== 'GARAGE') return;
            const part = state.currentCar.parts.find(p => p.id === id);

            if (part && !part.removed) {
                part.boltsLeft--;
                if (part.boltsLeft <= 0) {
                    part.removed = true;
                    state.money += part.price;
                    state.stats.parts++;

                    if (state.currentCar.parts.every(p => p.removed)) {
                        state.gameState = 'IDLE';
                        state.stats.dismantled++;
                        state.currentCar = null;
                        document.getElementById('status-text').innerText = "Готово! Закажите еще";
                    }
                }
                updateUI();
            }
        }

        function renderParts() {
            const grid = document.getElementById('parts-grid');
            grid.innerHTML = '';

            if (!state.currentCar || state.gameState !== 'GARAGE') {
                grid.innerHTML = '<div style="grid-column: span 3; text-align:center; opacity:0.5; font-size:0.8rem;">Гараж пуст</div>';
                return;
            }

            state.currentCar.parts.forEach(p => {
                const btn = document.createElement('div');
                btn.className = `part-btn ${p.removed ? 'disabled' : ''}`;
                btn.onclick = () => tapPart(p.id);
                btn.innerHTML = `
                    <div style="font-size:1.1rem">${p.name.split(' ')[0]}</div>
                    <div style="font-size:0.65rem">${p.name.split(' ')[1]}</div>
                    ${!p.removed ? `<div style="font-size:0.7rem; color:#ffeb3b">🔩 x${p.boltsLeft}</div>` : '✓'}
                `;
                grid.appendChild(btn);
            });
        }

        // МОДАЛЬНЫЕ ОКНА
        function openAchievements() {
            const list = document.getElementById('achieve-list');
            list.innerHTML = '';
            ACHIEVEMENTS.forEach(a => {
                const isDone = state.claimedAch.includes(a.id);
                const canGet = a.check(state) && !isDone;
                list.innerHTML += `
                    <div class="achieve-item">
                        <div>
                            <div style="font-size:0.85rem">${a.title}</div>
                            <div style="font-size:0.7rem; color:#aaa">${a.desc}</div>
                        </div>
                        ${canGet ? `<button onclick="claimAch('${a.id}', ${a.reward})" style="background:#4caf50; border:none; color:#fff; padding:5px 8px; border-radius:8px;">+💎${a.reward}</button>` : ''}
                        ${isDone ? '<span>✅</span>' : ''}
                    </div>
                `;
            });
            document.getElementById('achieve-modal').style.display = 'flex';
        }

        function claimAch(id, reward) {
            state.claimedAch.push(id);
            state.gems += reward;
            openAchievements();
            updateUI();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openShop() { alert("Магазин скоро откроется!"); }
        function buyUpgrade() { 
            if(state.money >= 500) { state.money -= 500; state.pneumoMult += 0.3; updateUI(); } 
        }

        // ОТРИСОВКА В СТИЛЕ CASUAL 2D
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (state.gameState === 'DELIVERING') {
                state.towProgress += 0.025;
                const x = -60 + (cx + 60) * state.towProgress;
                
                // Простая грузовичок-доставка
                ctx.fillStyle = "#ff9800";
                ctx.fillRect(x - 30, cy - 10, 50, 20);
                if (state.towProgress >= 1) {
                    state.gameState = 'GARAGE';
                    document.getElementById('status-text').innerText = state.currentCar.name;
                    updateUI();
                }
            }

            if (state.gameState === 'GARAGE' && state.currentCar) {
                // Корпус машины (Casual Style)
                ctx.fillStyle = state.currentCar.color;
                ctx.beginPath();
                ctx.roundRect(cx - 50, cy - 20, 100, 40, 10);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#fff";
                ctx.stroke();

                // Окна
                ctx.fillStyle = "#263238";
                ctx.fillRect(cx - 15, cy - 15, 40, 30);

                // Колеса
                ctx.fillStyle = "#111";
                ctx.beginPath();
                ctx.arc(cx - 30, cy + 20, 10, 0, Math.PI*2);
                ctx.arc(cx + 30, cy + 20, 10, 0, Math.PI*2);
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        updateUI();
        draw();
    </script>
</body>
</html>
