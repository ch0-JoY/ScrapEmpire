<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Salvage Simulator Ultimate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0a0a0f; color: #fff; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; max-width: 480px; margin: 0 auto; }
        
        /* HEADER */
        header { background: #14141f; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #28283d; }
        .stats { display: flex; gap: 15px; font-weight: 800; font-size: 1.1rem; }
        .money { color: #4caf50; }
        .gems { color: #00bcd4; }

        /* GARAGE AREA */
        .garage-card { background: #101018; border-radius: 12px; padding: 10px; border: 1px solid #28283d; text-align: center; position: relative; transition: all 0.3s; }
        .status-badge { background: #1c1c2b; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 8px; color: #aaa; border: 1px solid #383852; }
        canvas { width: 100%; height: 210px; border-radius: 8px; display: block; }

        /* SECTIONS */
        .section-title { font-size: 0.8rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; font-weight: bold; }
        
        /* GRID & BUTTONS */
        .parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .part-card { background: #161622; border: 1px solid #28283d; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .part-card.removed { opacity: 0.2; filter: grayscale(1); }
        .part-info { font-size: 0.8rem; text-align: left; }
        .part-price { color: #4caf50; font-size: 0.75rem; font-weight: bold; }
        .part-bolts { font-size: 0.7rem; color: #ff9800; font-weight: bold; }

        .btn-remove { background: #e53935; color: white; border: none; padding: 8px 10px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .btn-remove:active { transform: scale(0.92); }

        /* SHOP & CARDS */
        .shop-list { display: flex; flex-direction: column; gap: 8px; }
        .btn-main { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; width: 100%; display: flex; justify-content: space-between; align-items: center; border: 1px solid #4caf50; }
        .btn-main:disabled { background: #1a1a22; border-color: #333; color: #555; }
        .btn-box { background: linear-gradient(135deg, #ff9800, #e65100); border-color: #ffb74d; }
        .btn-exchange { background: linear-gradient(135deg, #00acc1, #006064); border-color: #00bcd4; }
        
        .btn-upgrade { background: #161622; color: white; border: 1px solid #28283d; padding: 10px 12px; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        
        /* ACHIEVEMENTS & SKINS */
        .achieve-card { background: #161622; border: 1px solid #28283d; padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .achieve-btn { background: #ff9800; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* TOAST & ANIMATION */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #e53935; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; display: none; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .floating-text { position: absolute; color: #4caf50; font-weight: bold; font-size: 1.2rem; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }
    </style>
</head>
<body>

    <div class="toast" id="toast">Не хватает денег!</div>

    <header>
        <div style="font-weight: bold; font-size: 0.9rem;">🛠 Auto Salvage PRO</div>
        <div class="stats">
            <span class="money">💵 $<span id="money">1000</span></span>
            <span class="gems">💎 <span id="gems">10</span></span>
        </div>
    </header>

    <!-- ГАРАЖ -->
    <div class="garage-card" id="garage-box">
        <div class="status-badge" id="status-text">Закажите авто ниже</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- ДЕТАЛИ -->
    <div class="section-title">⚙️ Разборка (Кликай по болтам)</div>
    <div class="parts-grid" id="parts-container">
        <div style="grid-column: span 2; text-align: center; color: #555; padding: 15px; background: #14141f; border-radius: 8px;">
            Гараж пуст
        </div>
    </div>

    <!-- АВТОРЫНОК -->
    <div class="section-title">🚗 Аукцион и Заказ</div>
    <div class="shop-list">
        <button class="btn-main btn-box" id="buy-box-btn" onclick="buyContainer()">
            <span>📦 Контейнер-Сюрприз</span>
            <span>$500</span>
        </button>
        <button class="btn-main" id="buy-car-btn" onclick="buyCar()">
            <span>🚗 Обычное авто</span>
            <span>$300</span>
        </button>
    </div>

    <!-- ДОСТИЖЕНИЯ -->
    <div class="section-title">🏆 Достижения</div>
    <div class="shop-list" id="achieve-container"></div>

    <!-- СКИНЫ ГАРАЖА -->
    <div class="section-title">🎨 Скины Гаража</div>
    <div class="shop-list">
        <button class="btn-upgrade" onclick="setSkin('default')"><span>🏚 Стандартный Бокс</span><span>Бесплатно</span></button>
        <button class="btn-upgrade" onclick="buySkin('cyber', 15)"><span>⚡ Неоновый Кибер-Бокс</span><span id="skin-cyber">💎 15</span></button>
        <button class="btn-upgrade" onclick="buySkin('gold', 30)"><span>👑 Золотой Бокс</span><span id="skin-gold">💎 30</span></button>
    </div>

    <!-- ОБМЕННИК -->
    <div class="section-title">💎 Банк</div>
    <div class="shop-list">
        <button class="btn-main btn-exchange" onclick="exchangeGems()">
            <span>Обменять 5 💎 ➔ $1,000</span>
            <span>Обменять</span>
        </button>
    </div>

    <script>
        let state = {
            money: 1000,
            gems: 10,
            currentCar: null,
            gameState: 'IDLE',
            towProgress: 0,
            currentSkin: 'default',
            ownedSkins: ['default'],
            stats: { carsDismantled: 0, partsRemoved: 0, totalEarned: 0 },
            claimedAchievements: []
        };

        const ACHIEVEMENTS = [
            { id: 'first_car', title: 'Первые шаги', desc: 'Разобрать 1 авто', reward: 5, check: s => s.stats.carsDismantled >= 1 },
            { id: 'parts_25', title: 'Мастер-Гайковерт', desc: 'Снять 25 деталей', reward: 10, check: s => s.stats.partsRemoved >= 25 },
            { id: 'rich', title: 'Авто-Магнат', desc: 'Заработать всего $5,000', reward: 20, check: s => s.stats.totalEarned >= 5000 }
        ];

        const CAR_MODELS = [
            { name: "Старый Хэтчбек", rarity: "🟢 Обычный", color: "#66bb6a", basePrice: 300, mult: 1 },
            { name: "Ржавый Седан", rarity: "🟢 Обычный", color: "#8d6e63", basePrice: 450, mult: 1.2 },
            { name: "Турбо Купе", rarity: "🔵 Редкий", color: "#29b6f6", basePrice: 1200, mult: 2.3 },
            { name: "GT-RX", rarity: "🟣 Эпик", color: "#ab47bc", basePrice: 4000, mult: 5.5 },
            { name: "Phantom X", rarity: "🟠 Легенда", color: "#ffa726", basePrice: 12000, mult: 14 }
        ];

        // Детали с указанием количества болтов!
        const BASE_PARTS = [
            { id: 'door', name: '🚪 Дверь', ratio: 0.15, maxBolts: 2 },
            { id: 'wheel', name: '🛞 Колесо', ratio: 0.12, maxBolts: 5 },
            { id: 'battery', name: '🔋 Аккум', ratio: 0.13, maxBolts: 1 },
            { id: 'generator', name: '🪫 Генератор', ratio: 0.18, maxBolts: 2 },
            { id: 'engine', name: '🛠 Двигатель', ratio: 0.34, maxBolts: 4 },
            { id: 'body', name: '🚘 Кузов', ratio: 0.28, maxBolts: 1 }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth - 20;
            canvas.height = 210;
        }
        window.addEventListener('resize', resize);
        resize();

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(state.money);
            document.getElementById('gems').innerText = state.gems;
            
            const isIdle = state.gameState === 'IDLE';
            document.getElementById('buy-car-btn').disabled = !isIdle;
            document.getElementById('buy-box-btn').disabled = !isIdle;

            renderParts();
            renderAchievements();
        }

        function buyCar() {
            if (state.money < 300) { showToast("Не хватает денег!"); return; }
            state.money -= 300;
            startCarDelivery(CAR_MODELS[0]);
        }

        function buyContainer() {
            if (state.money < 500) { showToast("Не хватает денег!"); return; }
            state.money -= 500;
            const rand = Math.random();
            let model = CAR_MODELS[1];
            if (rand > 0.4) model = CAR_MODELS[2];
            if (rand > 0.8) model = CAR_MODELS[3];
            if (rand > 0.95) model = CAR_MODELS[4];
            startCarDelivery(model);
        }

        function startCarDelivery(model) {
            state.currentCar = {
                ...model,
                parts: BASE_PARTS.map(p => ({
                    ...p,
                    boltsLeft: p.maxBolts,
                    price: Math.floor(model.basePrice * p.ratio * model.mult),
                    removed: false
                }))
            };

            state.gameState = 'DELIVERING';
            state.towProgress = 0;
            document.getElementById('status-text').innerText = "Эвакуатор везёт заказ...";
            updateUI();
        }

        // МЕХАНИКА ОТКРУЧИВАНИЯ БОЛТОВ
        function tapBolts(id) {
            if (state.gameState !== 'GARAGE' || !state.currentCar) return;

            const part = state.currentCar.parts.find(p => p.id === id);
            if (part && !part.removed) {
                part.boltsLeft--;

                if (part.boltsLeft <= 0) {
                    part.removed = true;
                    state.money += part.price;
                    state.stats.partsRemoved++;
                    state.stats.totalEarned += part.price;

                    showMoneyAnim(`+$${part.price}`);

                    if (state.currentCar.parts.every(p => p.removed)) {
                        state.gameState = 'IDLE';
                        state.stats.carsDismantled++;
                        state.currentCar = null;
                        document.getElementById('status-text').innerText = "Машина разобрана! Купите новую.";
                    }
                }
                updateUI();
            }
        }

        function showMoneyAnim(text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            const box = document.getElementById('garage-box').getBoundingClientRect();
            el.style.left = (box.width / 2) + 'px';
            el.style.top = (box.height / 2) + 'px';
            document.getElementById('garage-box').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function renderParts() {
            const container = document.getElementById('parts-container');
            container.innerHTML = '';

            if (!state.currentCar || state.gameState !== 'GARAGE') {
                container.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #555; padding: 15px; background: #14141f; border-radius: 8px;">Гараж пуст</div>';
                return;
            }

            state.currentCar.parts.forEach(p => {
                const card = document.createElement('div');
                card.className = `part-card ${p.removed ? 'removed' : ''}`;
                card.innerHTML = `
                    <div class="part-info">
                        <div>${p.name}</div>
                        <div class="part-price">+$${p.price}</div>
                        ${!p.removed && p.maxBolts > 1 ? `<div class="part-bolts">🔩 Осталось: ${p.boltsLeft}</div>` : ''}
                    </div>
                    ${!p.removed ? `
                        <button class="btn-remove" onclick="tapBolts('${p.id}')">
                            <span>${p.maxBolts > 1 ? 'Крутить' : 'Снять'}</span>
                        </button>
                    ` : '<span>✓</span>'}
                `;
                container.appendChild(card);
            });
        }

        function renderAchievements() {
            const container = document.getElementById('achieve-container');
            container.innerHTML = '';

            ACHIEVEMENTS.forEach(ach => {
                const isClaimed = state.claimedAchievements.includes(ach.id);
                const canClaim = ach.check(state) && !isClaimed;

                const card = document.createElement('div');
                card.className = 'achieve-card';
                card.innerHTML = `
                    <div>
                        <div style="font-weight:bold">${ach.title}</div>
                        <div style="font-size:0.75rem; color:#888">${ach.desc}</div>
                    </div>
                    ${canClaim ? `<button class="achieve-btn" onclick="claimAchieve('${ach.id}', ${ach.reward})">+💎 ${ach.reward}</button>` : ''}
                    ${isClaimed ? '<span style="color:#4caf50">Выполнено</span>' : ''}
                    ${!canClaim && !isClaimed ? '<span style="color:#555">В процессе</span>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function claimAchieve(id, reward) {
            state.claimedAchievements.push(id);
            state.gems += reward;
            updateUI();
        }

        function buySkin(skinId, cost) {
            if (state.ownedSkins.includes(skinId)) {
                setSkin(skinId);
                return;
            }
            if (state.gems >= cost) {
                state.gems -= cost;
                state.ownedSkins.push(skinId);
                setSkin(skinId);
                document.getElementById(`skin-${skinId}`).innerText = "Куплено";
                updateUI();
            } else {
                showToast("Не хватает кристаллов!");
            }
        }

        function setSkin(skinId) {
            state.currentSkin = skinId;
        }

        function exchangeGems() {
            if (state.gems >= 5) {
                state.gems -= 5;
                state.money += 1000;
                updateUI();
            } else {
                showToast("Не хватает кристаллов!");
            }
        }

        // --- РИСОВАНИЕ С УЧЕТОМ СКИНОФ ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 10;

            // Цвета скинов
            let bgColor = "#14141f";
            let borderColor = "#28283d";
            if (state.currentSkin === 'cyber') { bgColor = "#051329"; borderColor = "#00bcd4"; }
            if (state.currentSkin === 'gold') { bgColor = "#291f05"; borderColor = "#ffc107"; }

            // Гараж
            ctx.fillStyle = bgColor;
            ctx.fillRect(cx - 120, cy - 70, 240, 140);
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(cx - 120, cy - 70, 240, 140);

            // Эвакуатор
            if (state.gameState === 'DELIVERING') {
                state.towProgress += 0.02;
                const x = -80 + (cx + 80) * state.towProgress;

                ctx.fillStyle = "#ff9800";
                ctx.fillRect(x - 40, cy - 15, 60, 30);
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 10, cy - 25, 20, 20);

                if (state.towProgress >= 1) {
                    state.gameState = 'GARAGE';
                    document.getElementById('status-text').innerText = `${state.currentCar.rarity} ${state.currentCar.name}`;
                    updateUI();
                }
            }

            // Машина
            if (state.gameState === 'GARAGE' && state.currentCar) {
                ctx.fillStyle = state.currentCar.color;
                ctx.beginPath();
                ctx.roundRect(cx - 60, cy - 20, 120, 40, 8);
                ctx.fill();

                ctx.fillStyle = "#111";
                ctx.beginPath();
                ctx.arc(cx - 35, cy + 20, 10, 0, Math.PI * 2);
                ctx.arc(cx + 35, cy + 20, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(state.currentCar.name, cx, cy - 40);
            }

            requestAnimationFrame(draw);
        }

        updateUI();
        draw();
    </script>
</body>
</html>
