<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Salvage Simulator Deluxe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0c0d12; color: #fff; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; max-width: 480px; margin: 0 auto; }
        
        /* HEADER */
        header { background: #161722; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #28293d; }
        .stats { display: flex; gap: 15px; font-weight: 800; font-size: 1.1rem; }
        .money { color: #4caf50; }
        .gems { color: #00bcd4; }

        /* GARAGE AREA */
        .garage-card { background: #12131c; border-radius: 12px; padding: 10px; border: 1px solid #28293d; text-align: center; position: relative; }
        .status-badge { background: #1e1f2e; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 8px; color: #aaa; border: 1px solid #383952; }
        canvas { width: 100%; height: 210px; background: #08090d; border-radius: 8px; display: block; }

        /* SECTIONS */
        .section-title { font-size: 0.8rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; font-weight: bold; }
        
        /* GRID & BUTTONS */
        .parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .part-card { background: #181926; border: 1px solid #28293d; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .part-card.removed { opacity: 0.2; filter: grayscale(1); }
        .part-info { font-size: 0.8rem; text-align: left; }
        .part-price { color: #4caf50; font-size: 0.75rem; font-weight: bold; }
        .part-condition { font-size: 0.68rem; color: #ffb300; }
        .btn-remove { background: #e53935; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .btn-remove:active { transform: scale(0.95); }

        /* SHOP & CARDS */
        .shop-list { display: flex; flex-direction: column; gap: 8px; }
        .btn-main { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 0.95rem; width: 100%; display: flex; justify-content: space-between; align-items: center; border: 1px solid #4caf50; }
        .btn-main:disabled { background: #1c1c24; border-color: #333; color: #555; }
        .btn-box { background: linear-gradient(135deg, #ff9800, #e65100); border-color: #ffb74d; }
        .btn-exchange { background: linear-gradient(135deg, #00acc1, #006064); border-color: #00bcd4; }
        
        .btn-upgrade { background: #181926; color: white; border: 1px solid #28293d; padding: 10px 12px; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .btn-upgrade:disabled { opacity: 0.4; }

        /* NOTIFICATION TOAST */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #e53935; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; display: none; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* FLOATING TEXT ANIMATION */
        .floating-text { position: absolute; color: #4caf50; font-weight: bold; font-size: 1.2rem; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }
    </style>
</head>
<body>

    <div class="toast" id="toast">Не хватает денег!</div>

    <header>
        <div style="font-weight: bold; font-size: 0.9rem;">🛠 Auto Salvage PRO</div>
        <div class="stats">
            <span class="money">💵 $<span id="money">1000</span></span>
            <span class="gems">💎 <span id="gems">10</span></span>
        </div>
    </header>

    <!-- ГАРАЖ -->
    <div class="garage-card" id="garage-box">
        <div class="status-badge" id="status-text">Закажите контейнер или авто ниже</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- ДЕТАЛИ -->
    <div class="section-title">⚙️ Разборка по деталям</div>
    <div class="parts-grid" id="parts-container">
        <div style="grid-column: span 2; text-align: center; color: #555; padding: 15px; background: #12131c; border-radius: 8px;">
            Гараж пуст
        </div>
    </div>

    <!-- КОНТЕЙНЕРЫ И АВТО -->
    <div class="section-title">📦 Покупка и Аукцион</div>
    <div class="shop-list">
        <button class="btn-main btn-box" id="buy-box-btn" onclick="buyContainer()">
            <span>📦 Контейнер-Сюрприз</span>
            <span>$500</span>
        </button>
        <button class="btn-main" id="buy-car-btn" onclick="buyCar()">
            <span>🚗 Заказ на Авторынке</span>
            <span>$300</span>
        </button>
        <button class="btn-main" id="rescue-btn" onclick="getRescueCar()" style="background: #333; border-color: #555; display: none;">
            <span>🆘 Бесплатный эвакуатор (Помощь)</span>
            <span>$0</span>
        </button>
    </div>

    <!-- БАНК / ОБМЕН КРИСТАЛЛОВ -->
    <div class="section-title">💎 Обменник Кристаллов</div>
    <div class="shop-list">
        <button class="btn-main btn-exchange" onclick="exchangeGems()">
            <span>Обменять 5 💎 ➔ $1,000</span>
            <span>Обменять</span>
        </button>
    </div>

    <!-- УЛУЧШЕНИЯ И ПЕРСОНАЛ -->
    <div class="section-title">🛠 Рабочие и Оборудование</div>
    <div class="shop-list">
        <button class="btn-upgrade" id="btn-pneumo" onclick="buyUpgrade('pneumo')">
            <span>⚡ Пневмоинструмент (Цена деталей +20%)</span>
            <span id="cost-pneumo">$600</span>
        </button>
        <button class="btn-upgrade" id="btn-mechanic" onclick="hireWorker('mechanic')">
            <span>👷 Авто-Механик (Авто-разборка)</span>
            <span id="cost-mechanic">$1200</span>
        </button>
    </div>

    <script>
        let state = {
            money: 1000,
            gems: 10,
            currentCar: null,
            gameState: 'IDLE',
            towProgress: 0,
            pneumoLevel: 1,
            workers: { mechanic: false }
        };

        const CAR_MODELS = [
            { name: "Старый Хэтчбек", rarity: "🟢 Обычный", color: "#66bb6a", basePrice: 300, mult: 1 },
            { name: "Ржавый Седан", rarity: "🟢 Обычный", color: "#8d6e63", basePrice: 450, mult: 1.2 },
            { name: "Семейный Универсал", rarity: "🟢 Обычный", color: "#78909c", basePrice: 600, mult: 1.4 },
            { name: "Турбо Купе", rarity: "🔵 Редкий", color: "#29b6f6", basePrice: 1200, mult: 2.3 },
            { name: "Спортивный Седан", rarity: "🔵 Редкий", color: "#26a69a", basePrice: 1800, mult: 2.8 },
            { name: "GT-RX", rarity: "🟣 Эпик", color: "#ab47bc", basePrice: 4000, mult: 5.5 },
            { name: "Falcon RS", rarity: "🟣 Эпик", color: "#ec407a", basePrice: 6000, mult: 7.0 },
            { name: "Phantom X", rarity: "🟠 Легенда", color: "#ffa726", basePrice: 12000, mult: 14 }
        ];

        const BASE_PARTS = [
            { id: 'door', name: '🚪 Дверь', ratio: 0.15 },
            { id: 'wheel', name: '🛞 Колесо', ratio: 0.12 },
            { id: 'battery', name: '🔋 Аккум', ratio: 0.13 },
            { id: 'generator', name: '🪫 Генератор', ratio: 0.18 },
            { id: 'engine', name: '🛠 Двигатель', ratio: 0.34 },
            { id: 'body', name: '🚘 Кузов', ratio: 0.28 }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth - 20;
            canvas.height = 210;
        }
        window.addEventListener('resize', resize);
        resize();

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(state.money);
            document.getElementById('gems').innerText = state.gems;
            
            const isIdle = state.gameState === 'IDLE';
            document.getElementById('buy-car-btn').disabled = !isIdle;
            document.getElementById('buy-box-btn').disabled = !isIdle;

            // Кнопка помощи если не хватает денег ни на что
            const rescueBtn = document.getElementById('rescue-btn');
            if (state.money < 300 && isIdle && !state.currentCar) {
                rescueBtn.style.display = 'flex';
            } else {
                rescueBtn.style.display = 'none';
            }

            if (state.workers.mechanic) {
                document.getElementById('cost-mechanic').innerText = "Нанят";
                document.getElementById('btn-mechanic').disabled = true;
            }

            renderParts();
        }

        function buyCar() {
            if (state.money < 300) {
                showToast("Не хватает денег на покупку авто!");
                return;
            }
            state.money -= 300;
            startCarDelivery(CAR_MODELS[0]);
        }

        function buyContainer() {
            if (state.money < 500) {
                showToast("Не хватает денег на Контейнер!");
                return;
            }
            state.money -= 500;
            
            // Выпадение со случайной редкостью
            const rand = Math.random();
            let model = CAR_MODELS[1];
            if (rand > 0.4) model = CAR_MODELS[3];
            if (rand > 0.75) model = CAR_MODELS[5];
            if (rand > 0.93) model = CAR_MODELS[7];

            startCarDelivery(model);
        }

        function getRescueCar() {
            startCarDelivery(CAR_MODELS[0]);
        }

        function exchangeGems() {
            if (state.gems >= 5) {
                state.gems -= 5;
                state.money += 1000;
                updateUI();
            } else {
                showToast("Не хватает кристаллов!");
            }
        }

        function startCarDelivery(model) {
            state.currentCar = {
                ...model,
                parts: BASE_PARTS.map(p => {
                    const condition = Math.floor(40 + Math.random() * 60); // 40%-100%
                    return {
                        ...p,
                        condition: condition,
                        price: Math.floor(model.basePrice * p.ratio * model.mult * (condition / 100) * state.pneumoLevel),
                        removed: false
                    };
                })
            };

            state.gameState = 'DELIVERING';
            state.towProgress = 0;
            document.getElementById('status-text').innerText = "Эвакуатор везёт заказ...";
            updateUI();
        }

        function removePart(id, event) {
            if (state.gameState !== 'GARAGE' || !state.currentCar) return;

            const part = state.currentCar.parts.find(p => p.id === id);
            if (part && !part.removed) {
                part.removed = true;
                state.money += part.price;

                showMoneyAnim(`+$${part.price}`);

                if (state.currentCar.parts.every(p => p.removed)) {
                    state.gameState = 'IDLE';
                    state.currentCar = null;
                    document.getElementById('status-text').innerText = "Машина разобрана! Купите новую.";
                }
                updateUI();
            }
        }

        function showMoneyAnim(text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            const box = document.getElementById('garage-box').getBoundingClientRect();
            el.style.left = (box.width / 2) + 'px';
            el.style.top = (box.height / 2) + 'px';
            document.getElementById('garage-box').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function renderParts() {
            const container = document.getElementById('parts-container');
            container.innerHTML = '';

            if (!state.currentCar || state.gameState !== 'GARAGE') {
                container.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #555; padding: 15px; background: #12131c; border-radius: 8px;">Гараж пуст</div>';
                return;
            }

            state.currentCar.parts.forEach(p => {
                const card = document.createElement('div');
                card.className = `part-card ${p.removed ? 'removed' : ''}`;
                card.innerHTML = `
                    <div class="part-info">
                        <div>${p.name}</div>
                        <div class="part-price">+$${p.price}</div>
                        <div class="part-condition">Сост: ${p.condition}%</div>
                    </div>
                    ${!p.removed ? `<button class="btn-remove" onclick="removePart('${p.id}', event)">Снять</button>` : '<span>✓</span>'}
                `;
                container.appendChild(card);
            });
        }

        function buyUpgrade(type) {
            if (type === 'pneumo' && state.money >= 600) {
                state.money -= 600;
                state.pneumoLevel += 0.2;
                document.getElementById('cost-pneumo').innerText = `Ур. ${Math.round(state.pneumoLevel * 10) / 10}`;
                updateUI();
            } else if (type === 'pneumo') {
                showToast("Не хватает денег!");
            }
        }

        function hireWorker(type) {
            if (type === 'mechanic' && !state.workers.mechanic && state.money >= 1200) {
                state.money -= 1200;
                state.workers.mechanic = true;
                updateUI();
            } else if (type === 'mechanic' && !state.workers.mechanic) {
                showToast("Не хватает денег!");
            }
        }

        // Автокликер (Механик)
        setInterval(() => {
            if (state.gameState === 'GARAGE' && state.currentCar && state.workers.mechanic) {
                const nextPart = state.currentCar.parts.find(p => !p.removed);
                if (nextPart) removePart(nextPart.id);
            }
        }, 2000);

        // --- ОТРИСОВКА SVG В ГАРАЖЕ ---
        function drawCarSVG(x, y, color) {
            // Корпус машины
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x - 60, y - 20, 120, 40, 8);
            ctx.fill();

            // Кабина
            ctx.fillStyle = "#1e2029";
            ctx.beginPath();
            ctx.roundRect(x - 30, y - 38, 70, 22, 5);
            ctx.fill();

            // Колеса
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.arc(x - 35, y + 20, 12, 0, Math.PI * 2);
            ctx.arc(x + 35, y + 20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Диски
            ctx.fillStyle = "#aaa";
            ctx.beginPath();
            ctx.arc(x - 35, y + 20, 5, 0, Math.PI * 2);
            ctx.arc(x + 35, y + 20, 5, 0, Math.PI * 2);
            ctx.fill();

            // Фары
            ctx.fillStyle = "#ffeb3b";
            ctx.fillRect(x + 55, y - 10, 5, 10);
        }

        function drawTowTruck(x, y) {
            // База эвакуатора
            ctx.fillStyle = "#ff9800";
            ctx.fillRect(x - 50, y - 15, 70, 30);
            ctx.fillStyle = "#212121";
            ctx.fillRect(x + 20, y - 25, 30, 40);

            // Кран
            ctx.strokeStyle = "#777";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x - 30, y - 15);
            ctx.lineTo(x - 60, y - 40);
            ctx.stroke();

            // Колеса
            ctx.fillStyle = "#111";
            ctx.beginPath();
            ctx.arc(x - 30, y + 18, 10, 0, Math.PI * 2);
            ctx.arc(x + 30, y + 18, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 10;

            // Сцена гаража
            ctx.fillStyle = "#12131c";
            ctx.fillRect(cx - 120, cy - 70, 240, 140);
            ctx.strokeStyle = "#28293d";
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - 120, cy - 70, 240, 140);

            // Доставка
            if (state.gameState === 'DELIVERING') {
                state.towProgress += 0.02;
                const x = -80 + (cx + 80) * state.towProgress;

                drawTowTruck(x, cy);

                if (state.towProgress >= 1) {
                    state.gameState = 'GARAGE';
                    document.getElementById('status-text').innerText = `${state.currentCar.rarity} ${state.currentCar.name}`;
                    updateUI();
                }
            }

            // Машина в гараже
            if (state.gameState === 'GARAGE' && state.currentCar) {
                drawCarSVG(cx, cy, state.currentCar.color);

                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(state.currentCar.name, cx, cy - 50);
            }

            requestAnimationFrame(draw);
        }

        updateUI();
        draw();
    </script>
</body>
</html>
