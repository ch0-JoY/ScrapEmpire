<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Salvage Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #121218; color: #fff; padding: 10px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
        
        /* HEADER */
        header { background: #1e1e2a; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .logo { font-size: 1.1rem; font-weight: bold; }
        .stats { display: flex; gap: 15px; font-weight: bold; font-size: 1.1rem; }
        .money { color: #4caf50; }
        .gems { color: #00bcd4; }

        /* GARAGE / CANVAS AREA */
        .garage-card { background: #1e1e2a; border-radius: 12px; padding: 10px; border: 1px solid #333; text-align: center; position: relative; }
        .status-badge { background: #2a2a3a; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 8px; color: #aaa; border: 1px solid #444; }
        canvas { width: 100%; height: 180px; background: #0a0a0d; border-radius: 8px; display: block; }

        /* SECTION TITLE */
        .section-title { font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        /* PARTS DISMANTLE SECTION */
        .parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .part-card { background: #252535; border: 1px solid #3d3d52; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .part-card.removed { opacity: 0.3; filter: grayscale(1); }
        .part-info { font-size: 0.85rem; }
        .part-price { color: #4caf50; font-size: 0.75rem; font-weight: bold; }
        .btn-remove { background: #e53935; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; }

        /* SHOP & WORKERS */
        .shop-list { display: flex; flex-direction: column; gap: 8px; }
        .btn-action { background: #2e7d32; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .btn-action:disabled { background: #333; color: #666; }
        .btn-upgrade { background: #3f51b5; color: white; border: none; padding: 10px 12px; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🛠 Авторазборка</div>
        <div class="stats">
            <span class="money">💵 $<span id="money">1000</span></span>
            <span class="gems">💎 <span id="gems">10</span></span>
        </div>
    </header>

    <!-- ИГРОВОЙ ГАРАЖ -->
    <div class="garage-card">
        <div class="status-badge" id="status-text">Закажите авто на рынке ниже</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- РАЗБОРКА (ДЕТАЛИ) -->
    <div class="section-title">⚙️ Детали на разборку</div>
    <div class="parts-grid" id="parts-container">
        <div style="grid-column: span 2; text-align: center; color: #555; padding: 15px; background: #1e1e2a; border-radius: 8px;">
            Нет машины в гараже
        </div>
    </div>

    <!-- АВТОРЫНОК -->
    <div class="section-title">🚗 Авторынок</div>
    <div class="shop-list">
        <button class="btn-action" id="buy-btn" onclick="buyCar()">
            <span>Купить случайное авто</span>
            <span id="car-cost">$300</span>
        </button>
    </div>

    <!-- УЛУЧШЕНИЯ И РАБОТНИКИ -->
    <div class="section-title">🛒 Улучшения и Наём</div>
    <div class="shop-list">
        <button class="btn-upgrade" onclick="buyUpgrade('jack')">
            <span>🔩 Подъёмник (ускорение)</span>
            <span id="cost-jack">$200</span>
        </button>
        <button class="btn-upgrade" onclick="hireWorker('mechanic')">
            <span>👷 Авто-Механик</span>
            <span id="cost-mechanic">$1000</span>
        </button>
    </div>

    <script>
        let state = {
            money: 1000,
            gems: 10,
            currentCar: null,
            gameState: 'IDLE', // IDLE, DELIVERING, GARAGE
            towProgress: 0,
            upgrades: { jack: 1 },
            workers: { mechanic: false }
        };

        const CAR_MODELS = [
            { name: "Старый Хэтчбек", rarity: "🟢 Обычный", color: "#8bc34a", basePrice: 300, mult: 1 },
            { name: "Ржавый Седан", rarity: "🟢 Обычный", color: "#8bc34a", basePrice: 450, mult: 1.2 },
            { name: "Турбо Купе", rarity: "🔵 Редкий", color: "#2196f3", basePrice: 1000, mult: 2.2 },
            { name: "GT-RX", rarity: "🟣 Эпик", color: "#9c27b0", basePrice: 3500, mult: 5 },
            { name: "Phantom X", rarity: "🟠 Легенда", color: "#ff9800", basePrice: 10000, mult: 12 }
        ];

        const BASE_PARTS = [
            { id: 'door', name: '🚪 Дверь', ratio: 0.15 },
            { id: 'wheel', name: '🛞 Колесо', ratio: 0.10 },
            { id: 'battery', name: '🔋 Аккум', ratio: 0.12 },
            { id: 'generator', name: '🪫 Генератор', ratio: 0.18 },
            { id: 'engine', name: '🛠 Двигатель', ratio: 0.35 },
            { id: 'body', name: '🚘 Кузов', ratio: 0.30 }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth - 20;
            canvas.height = 180;
        }
        window.addEventListener('resize', resize);
        resize();

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(state.money);
            document.getElementById('gems').innerText = state.gems;
            document.getElementById('buy-btn').disabled = state.gameState !== 'IDLE';

            renderParts();
        }

        function buyCar() {
            if (state.gameState !== 'IDLE') return;

            const rand = Math.random();
            let model = CAR_MODELS[0];
            if (rand > 0.5) model = CAR_MODELS[1];
            if (rand > 0.75) model = CAR_MODELS[2];
            if (rand > 0.90) model = CAR_MODELS[3];
            if (rand > 0.98) model = CAR_MODELS[4];

            if (state.money < model.basePrice) {
                alert("Не хватает денег!");
                return;
            }

            state.money -= model.basePrice;
            state.currentCar = {
                ...model,
                parts: BASE_PARTS.map(p => ({
                    ...p,
                    price: Math.floor(model.basePrice * p.ratio * model.mult),
                    removed: false
                }))
            };

            state.gameState = 'DELIVERING';
            state.towProgress = 0;
            document.getElementById('status-text').innerText = "Эвакуатор везёт авто...";
            updateUI();
        }

        function removePart(id) {
            if (state.gameState !== 'GARAGE' || !state.currentCar) return;

            const part = state.currentCar.parts.find(p => p.id === id);
            if (part && !part.removed) {
                part.removed = true;
                state.money += part.price;

                if (state.currentCar.parts.every(p => p.removed)) {
                    state.gameState = 'IDLE';
                    state.currentCar = null;
                    document.getElementById('status-text').innerText = "Машина разобрана! Купите новую.";
                }
                updateUI();
            }
        }

        function renderParts() {
            const container = document.getElementById('parts-container');
            container.innerHTML = '';

            if (!state.currentCar || state.gameState !== 'GARAGE') {
                container.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #666; padding: 15px; background: #1e1e2a; border-radius: 8px;">Нет машины в гараже</div>';
                return;
            }

            state.currentCar.parts.forEach(p => {
                const card = document.createElement('div');
                card.className = `part-card ${p.removed ? 'removed' : ''}`;
                card.innerHTML = `
                    <div class="part-info">
                        <div>${p.name}</div>
                        <div class="part-price">+$${p.price}</div>
                    </div>
                    ${!p.removed ? `<button class="btn-remove" onclick="removePart('${p.id}')">Снять</button>` : '<span>✓</span>'}
                `;
                container.appendChild(card);
            });
        }

        function buyUpgrade(type) {
            if (type === 'jack' && state.money >= 200) {
                state.money -= 200;
                state.upgrades.jack += 0.5;
                document.getElementById('cost-jack').innerText = "Куплено";
                updateUI();
            }
        }

        function hireWorker(type) {
            if (type === 'mechanic' && !state.workers.mechanic && state.money >= 1000) {
                state.money -= 1000;
                state.workers.mechanic = true;
                document.getElementById('cost-mechanic').innerText = "Работает";
                updateUI();
            }
        }

        // Авто-разборка механиком
        setInterval(() => {
            if (state.gameState === 'GARAGE' && state.currentCar && state.workers.mechanic) {
                const nextPart = state.currentCar.parts.find(p => !p.removed);
                if (nextPart) removePart(nextPart.id);
            }
        }, 2000);

        // Отрисовка
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Гараж
            ctx.fillStyle = "#1a1a24";
            ctx.fillRect(cx - 100, cy - 60, 200, 120);
            ctx.strokeStyle = "#333";
            ctx.strokeRect(cx - 100, cy - 60, 200, 120);

            if (state.gameState === 'DELIVERING') {
                state.towProgress += 0.02 * state.upgrades.jack;
                const x = -50 + (cx + 50) * state.towProgress;

                ctx.fillStyle = "#ffb300";
                ctx.fillRect(x - 30, cy - 15, 60, 30); // Эвакуатор

                if (state.towProgress >= 1) {
                    state.gameState = 'GARAGE';
                    document.getElementById('status-text').innerText = `${state.currentCar.rarity} ${state.currentCar.name}`;
                    updateUI();
                }
            }

            if (state.gameState === 'GARAGE' && state.currentCar) {
                ctx.fillStyle = state.currentCar.color;
                ctx.fillRect(cx - 50, cy - 25, 100, 50); // Автомобиль

                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(state.currentCar.name, cx, cy - 35);
            }

            requestAnimationFrame(loop);
        }

        updateUI();
        loop();
    </script>
</body>
</html>
